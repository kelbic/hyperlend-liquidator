[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.23"
optimizer = true
optimizer_runs = 200
# 05.08: вторая нога свопа довела liquidateTwoLeg до stack-too-deep на legacy-пайплайне.
# Альтернативой было прятать аргументы в calldata-структуру, но тогда боту пришлось бы
# кодировать кортеж с двумя динамическими bytes вручную — лишний источник ошибок на пути
# выстрела. IR-пайплайн решает это на стороне компилятора и попутно оптимизирует лучше.
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

# HyperEVM mainnet fork target for tests. chainId 999; standard EVM — HyperLend is an Aave-v3.6
# fork so the flashLoanSimple -> liquidationCall path is byte-identical to Aave. Set HL_RPC_URL to
# run the fork tests; the fork test early-returns green when it is unset (so CI without an RPC
# still passes). The pure/unit test always runs.
[rpc_endpoints]
hyperevm = "${HL_RPC_URL}"
